<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crisp Demo Reel</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap");

      html,
      body {
        margin: 0;
        background: #f7f7f3;
      }

      [data-composition-id="crisp-demo"] {
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: #f7f7f3;
        color: #18201f;
        font-family: Manrope, Arial, sans-serif;
      }

      .scene-content {
        width: 100%;
        height: 100%;
        padding: 72px 92px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 34px;
      }

      .topbar,
      .spoken,
      .media {
        background: #fbfcf8;
        border: 2px solid #dfe4dc;
        border-radius: 28px;
      }

      .topbar {
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 38px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 44px;
        font-weight: 800;
      }

      .mark {
        width: 62px;
        height: 44px;
        position: relative;
      }

      .mark span {
        position: absolute;
        height: 5px;
        border-radius: 999px;
        background: #28724f;
      }

      .mark span:nth-child(1) {
        width: 26px;
        left: 0;
        top: 6px;
      }

      .mark span:nth-child(2) {
        width: 42px;
        left: 12px;
        top: 19px;
      }

      .mark span:nth-child(3) {
        width: 52px;
        left: 24px;
        top: 32px;
        opacity: 0.78;
      }

      .status {
        font-family: "DM Mono", monospace;
        font-size: 20px;
        letter-spacing: 0.22em;
        color: #819087;
      }

      .media {
        height: 256px;
        padding: 34px;
        background: #18201f;
      }

      .video-strip {
        height: 188px;
        border-radius: 20px;
        background: #0c1211;
        position: relative;
        overflow: hidden;
      }

      .preview-frame {
        position: absolute;
        inset: 0 420px;
        background: #28724f;
        opacity: 0.16;
      }

      .play {
        position: absolute;
        top: 70px;
        left: 54px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: #fbfcf8;
      }

      .play::after {
        content: "";
        position: absolute;
        left: 24px;
        top: 17px;
        border-left: 22px solid #18201f;
        border-top: 14px solid transparent;
        border-bottom: 14px solid transparent;
      }

      .progress {
        position: absolute;
        left: 54px;
        right: 54px;
        bottom: 28px;
        height: 8px;
        border-radius: 999px;
        background: #dfe4dc;
      }

      .progress span {
        display: block;
        height: 8px;
        width: 43%;
        border-radius: inherit;
        background: #6fbd8e;
      }

      .time {
        position: absolute;
        top: 24px;
        right: 44px;
        font-family: "DM Mono", monospace;
        font-size: 24px;
        color: #fbfcf8;
      }

      .spoken {
        height: 100px;
        padding: 0 38px;
        display: flex;
        align-items: center;
        gap: 34px;
      }

      .label {
        font-family: "DM Mono", monospace;
        font-size: 20px;
        letter-spacing: 0.22em;
        color: #819087;
      }

      .words {
        display: flex;
        align-items: center;
        gap: 26px;
        font-size: 34px;
        color: #647069;
      }

      .word-fill {
        padding: 8px 16px 11px;
        border-radius: 14px;
        background: #dcefe3;
        box-shadow: inset 0 0 0 5px #28724f;
        color: #c9821e;
        font-weight: 800;
      }

      .transcript {
        flex: 1;
        padding-top: 18px;
      }

      .rule {
        height: 2px;
        background: #dfe4dc;
        margin: 22px 0 42px;
      }

      .transcript-line {
        font-size: 58px;
        line-height: 1.55;
        letter-spacing: -0.03em;
      }

      .selected {
        display: inline-block;
        padding: 0 17px 8px;
        border-radius: 14px;
        background: #dcefe3;
        box-shadow: inset 0 0 0 5px #28724f;
        color: #c9821e;
      }

      .wave {
        display: flex;
        align-items: end;
        gap: 5px;
        height: 68px;
      }

      .wave i {
        width: 7px;
        border-radius: 999px;
        background: rgba(40, 114, 79, 0.22);
      }

      .wave i.hot {
        background: rgba(201, 130, 30, 0.7);
      }
    </style>
  </head>
  <body>
    <div data-composition-id="crisp-demo" data-width="1600" data-height="900">
      <div class="scene-content">
        <div class="topbar">
          <div class="brand">
            <div class="mark"><span></span><span></span><span></span></div>
            <span>crisp</span>
          </div>
          <div class="status">TRANSCRIPT MEDIA EDITOR</div>
        </div>

        <div class="media">
          <div class="video-strip">
            <div class="preview-frame"></div>
            <div class="play"></div>
            <div class="time">0:07.5 / 0:18.6</div>
            <div class="progress"><span></span></div>
          </div>
        </div>

        <div class="spoken">
          <div class="label">SPOKEN NOW</div>
          <div class="words">
            <span>affordability</span>
            <span>as</span>
            <span class="word-fill">um</span>
            <span>Ellen</span>
            <span>rightfully</span>
            <span>pointed</span>
            <span>out</span>
          </div>
        </div>

        <div class="wave" aria-hidden="true">
          <i style="height: 48px"></i><i style="height: 54px"></i><i style="height: 42px"></i><i style="height: 63px"></i><i style="height: 39px"></i><i style="height: 58px"></i><i style="height: 51px"></i><i style="height: 65px"></i><i style="height: 43px"></i><i class="hot" style="height: 68px"></i><i class="hot" style="height: 68px"></i><i style="height: 48px"></i><i style="height: 62px"></i><i style="height: 44px"></i><i style="height: 55px"></i><i style="height: 36px"></i><i style="height: 61px"></i><i style="height: 50px"></i><i style="height: 66px"></i><i style="height: 57px"></i><i style="height: 45px"></i><i style="height: 62px"></i><i style="height: 52px"></i><i style="height: 64px"></i><i style="height: 41px"></i><i style="height: 59px"></i><i style="height: 46px"></i><i style="height: 67px"></i><i style="height: 53px"></i><i style="height: 60px"></i><i style="height: 39px"></i><i style="height: 56px"></i><i style="height: 49px"></i><i style="height: 65px"></i><i style="height: 44px"></i><i style="height: 58px"></i>
        </div>

        <div class="transcript">
          <div class="label">TRANSCRIPT</div>
          <div class="rule"></div>
          <div class="transcript-line">
            I mean maybe we should dare to dream because I think
            <span class="selected">uh</span> the Internet and access access to
            it and affordability as <span class="selected">um</span> Ellen
            rightfully pointed out.
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.from(".topbar", { y: -36, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.18);
        tl.from(".brand", { x: -26, opacity: 0, duration: 0.45, ease: "expo.out" }, 0.3);
        tl.from(".status", { x: 26, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.36);
        tl.from(".media", { scale: 0.97, opacity: 0, duration: 0.55, ease: "back.out(1.2)" }, 0.62);
        tl.from(".play", { scale: 0.72, opacity: 0, duration: 0.38, ease: "power4.out" }, 0.9);
        tl.from(".progress span", { scaleX: 0, transformOrigin: "left center", duration: 1.1, ease: "power2.inOut" }, 1.02);
        tl.from(".spoken", { y: 34, opacity: 0, duration: 0.5, ease: "sine.out" }, 1.38);
        tl.from(".words span", { y: 18, opacity: 0, duration: 0.38, stagger: 0.065, ease: "power3.out" }, 1.62);
        tl.from(".wave i", { scaleY: 0.1, transformOrigin: "bottom center", opacity: 0, duration: 0.5, stagger: 0.012, ease: "expo.out" }, 2.2);
        tl.from(".transcript .label", { x: -24, opacity: 0, duration: 0.35, ease: "power2.out" }, 2.72);
        tl.from(".rule", { scaleX: 0, transformOrigin: "left center", duration: 0.5, ease: "power1.out" }, 2.86);
        tl.from(".transcript-line", { y: 28, opacity: 0, duration: 0.55, ease: "power3.out" }, 3.08);
        tl.from(".selected", { scale: 0.86, backgroundColor: "#fbfcf8", duration: 0.42, stagger: 0.16, ease: "back.out(1.6)" }, 3.46);
        tl.to(".scene-content", { opacity: 0, duration: 0.55, ease: "sine.inOut" }, 7.35);
        window.__timelines["crisp-demo"] = tl;
      </script>
    </div>
  </body>
</html>
